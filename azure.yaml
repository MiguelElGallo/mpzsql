name: lakehouse
metadata:
  template: lakehouse@0.0.1
infra:
  provider: bicep
  path: infra
services:
  lakehouse:
    host: containerapp
    project: .
    language: docker
    docker:
      path: ./Dockerfile
      remoteBuild: true
hooks:
  postprovision:
    posix:
      shell: sh
      run: ./hooks/postprovision.sh
