[project]
name = "lakehouse"
version = "0.1.0"
description = "High-Performance SQL Server for the Cloud — Arrow Flight SQL + DuckDB"
readme = "README.md"
authors = [
    { name = "Miguel P Z", email = "60221874+MiguelElGallo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.20.0",
    "duckdb>=1.4.4",
    "grpcio>=1.60",
    "grpcio-health-checking>=1.78.0",
    "protobuf>=5.0",
    "pyarrow>=23.0.0",
    "pydantic-settings>=2.12.0",
    "pyjwt[crypto]>=2.0",
    "typer>=0.21.1",
]

[project.scripts]
lakehouse = "lakehouse.__main__:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "adbc-driver-flightsql>=1.10.0",
    "grpcio-tools>=1.78.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
    "types-protobuf>=6.32.1.20251210",
]

# ──────────────────────────────────────────────
#  Ruff — linter + formatter (sole tool)
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]
extend-exclude = ["src/lakehouse/proto/FlightSql_pb2.py", "src/lakehouse/proto/FlightSql_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle (docstrings)
    "ANN",  # flake8-annotations
]
ignore = [
    "D100",   # Missing docstring in public module (relaxed for now)
    "D104",   # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]  # Relax docstring + annotation rules in tests

# ──────────────────────────────────────────────
#  ty — type checker
# ──────────────────────────────────────────────
[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["src/lakehouse/proto/FlightSql_pb2.py", "src/lakehouse/proto/FlightSql_pb2.pyi"]

# ──────────────────────────────────────────────
#  pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

#  coverage
# ──────────────────────────────────────────────
[tool.coverage.run]
source = ["lakehouse"]

[tool.coverage.report]
omit = ["src/lakehouse/proto/FlightSql_pb2.py"]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
