[project]
name = "mpzsql"
version = "0.1.0"
description = "Apache Arrow FlightSQL Server with DuckDB and SQLite backends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "pyarrow>=21.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "protobuf>=4.25.0",
    "psycopg2-binary>=2.9.0",
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.15.0",
    "fsspec>=2023.12.0",
    "adlfs>=2023.12.0",
    "duckdb>=1.3.2",
    "adbc-driver-flightsql>=1.7.0",
    "pytest>=8.4.1",
    "coverage>=7.9.2",
    "logfire>=3.24.0",
    "pytest-cov>=6.2.1",
    "grpcio-tools>=1.74.0",
    "snowflake>=1.7.0",
]

[project.scripts]
mpzsql-server = "mpzsql.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.16.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpzsql"]

[tool.hatch.build]
include = ["src/mpzsql"]

[tool.hatch.build.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable additional rule sets for code quality
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt (f-string conversion)
    "PERF", # perflint
]

# Ignore specific rules that are too strict for this project
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "TRY003", # Avoid specifying long messages outside the exception class
    "PLR0913", # Too many arguments to function call
    "B008", # Do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
# Set maximum complexity (default is 10, we'll be a bit more lenient)
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8  # Maximum number of arguments for function/method

[tool.ruff.lint.per-file-ignores]
# Test files can have more complex functions and missing docstrings
"tests/*" = ["D", "C90", "PLR0913", "PLR0915"]
# CLI modules can have more complex argument parsing
"src/mpzsql/cli.py" = ["C90", "PLR0913"]

[tool.ruff.format]
# Use double quotes
quote-style = "double"
# Indent with spaces
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: marks tests as asyncio tests",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
]
